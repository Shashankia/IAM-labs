<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or brand }} · Helios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="theme-{{ theme }}">
  <header class="top">
    <div class="brand">{{ brand }}</div>
    <div class="system">{{ system_label }}</div>
  </header>
  <div class="shell">
    <aside>
      <p class="persona">{{ persona }}</p>
      <nav>
        {% for item in nav %}
          <a href="{{ item.href }}" class="{{ 'on' if item.key == active else '' }}">{{ item.label }}</a>
        {% endfor %}
      </nav>
    </aside>
    <main>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      {% block body %}{% endblock %}
    </main>
  </div>
</body>
</html>
